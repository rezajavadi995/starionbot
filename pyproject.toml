[project]
name = "starionbot"
version = "0.1.0"
description = "Telegram Stars & TON Crash Game Platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "aiogram>=3.10",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.29",
  "redis>=5.0",
  "alembic>=1.13",
  "pydantic-settings>=2.3",
  "python-dotenv>=1.0",
  "structlog>=24.2",
  "typer>=0.12",
  "rich>=13.7",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "mypy>=1.10",
  "ruff>=0.5",
  "black>=24.4",
  "pre-commit>=3.7",
  "gitleaks>=8.18",
  "trufflehog>=2.2"
]

[project.scripts]
tgbot = "admin_tools.cli:app"

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "N"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
